name: QA - Build, datos y recuperacion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: qa-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout sin credenciales persistentes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validar hashes y generar HTML autonomo
        run: |
          python scripts/build.py --check
          python scripts/build.py
      - name: Ejecutar pruebas de regresion e integridad
        run: python -m unittest discover -s tests -v
      - name: Verificar sintaxis JavaScript
        run: node --check src/scripts/dashboard.js
      - name: Probar fallo y recuperacion en clon temporal
        run: python scripts/qa_guardrails.py
      - name: Validar empaquetado de preview sin publicar
        run: |
          python -m scripts.package_preview --check
          python -m scripts.package_preview
      - name: Guardar candidato versionado en GitHub Actions
        if: matrix.python-version == '3.12' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: sdc-preview-v1.0.12
          path: |
            dist/preview-candidate/index.html
            dist/preview-candidate/candidate-manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Generar matriz de sustitutos UX-11.2 sin alterar datos
        run: python -m scripts.ux11_2_review
      - name: Respaldar matriz UX-11.2 para Drive
        if: matrix.python-version == '3.12' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: sdc-ux11-2-matriz
          path: |
            dist/ux11_2/catalogo_188.csv
            dist/ux11_2/casos_14.csv
            dist/ux11_2/resumen.json
          retention-days: 14
          if-no-files-found: error
      - name: Generar fichas comparables UX-11.3 sin recalcular puntajes
        run: python -m scripts.ux11_3_cards
      - name: Archivar fichas y falsadores UX-11.3
        if: matrix.python-version == '3.12' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: sdc-ux11-3-seis-fichas
          path: |
            dist/ux11_3/fichas_6.json
            dist/ux11_3/matriz_6.csv
            dist/ux11_3/pruebas_falsadoras_6.csv
            dist/ux11_3/resumen.json
          retention-days: 14
          if-no-files-found: error
      - name: Validar candidato UX-11.4, manteniendo baseline v1.0.12
        run: |
          python -m scripts.build_ux11_4 --check
          python -m scripts.build_ux11_4
          node --check src/ux11_4/render_concepts.js
      - name: Respaldar HTML candidato UX-11.4 para revision
        if: matrix.python-version == '3.12' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: sdc-ux11-4-candidato
          path: |
            dist/ux11_4/index.html
            dist/ux11_4/candidate-manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Confirmar que no se alteraron archivos rastreados
        run: git diff --exit-code && git diff --cached --exit-code
